<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#08070c">
  <title>STARUSH 试玩</title>
  <style>
    :root {
      --ink: #fffaf2;
      --muted: rgba(255, 250, 242, 0.70);
      --black: #08070c;
      --line: rgba(255, 255, 255, 0.14);
      --pink: #ed6b93;
      --blue: #4fa3e0;
      --yellow: #f0b429;
      --purple: #8b7bd8;
      --orange: #f08a4b;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0;
      min-height: 100%;
      overflow: hidden;
      background: #050508;
      color: var(--ink);
      font-family: "Microsoft YaHei", "Segoe UI", sans-serif;
      touch-action: none;
    }
    body {
      display: grid;
      place-items: center;
      padding: max(10px, env(safe-area-inset-top)) 10px max(10px, env(safe-area-inset-bottom));
      background:
        radial-gradient(circle at 30% 0%, rgba(237, 107, 147, 0.20), transparent 38%),
        linear-gradient(180deg, #15111e 0%, #050508 100%);
    }
    .phone {
      width: min(100vw - 20px, 430px);
      height: min(100dvh - 20px, 820px);
      min-height: 650px;
      display: grid;
      grid-template-rows: 124px 48px 1fr 48px 34px;
      border: 1px solid var(--line);
      background: linear-gradient(180deg, #17121e 0%, #09080d 100%);
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.46);
      overflow: hidden;
    }
    .hero {
      display: grid;
      grid-template-columns: 112px 1fr;
      gap: 14px;
      padding: 14px;
      border-bottom: 1px solid var(--line);
      background:
        linear-gradient(90deg, rgba(9, 8, 13, 0.30), rgba(9, 8, 13, 0.96)),
        linear-gradient(135deg, rgba(237, 107, 147, 0.20), rgba(79, 163, 224, 0.10));
    }
    .hero img {
      width: 112px;
      height: 96px;
      object-fit: cover;
      object-position: 50% 18%;
      border: 1px solid rgba(255, 255, 255, 0.16);
      filter: saturate(1.03) contrast(1.02);
    }
    .hero-copy {
      align-self: center;
      min-width: 0;
    }
    .eyebrow {
      margin: 0 0 6px;
      font: 700 11px/1 Consolas, "Courier New", monospace;
      letter-spacing: 0.18em;
      color: var(--yellow);
    }
    h1 {
      margin: 0 0 8px;
      font-size: clamp(25px, 7vw, 33px);
      line-height: 1.05;
      font-weight: 300;
      letter-spacing: 0;
    }
    .sub {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
    }
    .hud {
      display: grid;
      grid-template-columns: 1fr 110px;
      gap: 12px;
      align-items: center;
      padding: 8px 14px;
      border-bottom: 1px solid var(--line);
    }
    .label {
      display: block;
      margin-bottom: 5px;
      font: 700 11px/1 Consolas, "Courier New", monospace;
      letter-spacing: 0.16em;
      color: var(--muted);
    }
    .meter {
      height: 10px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      background: rgba(255, 255, 255, 0.09);
    }
    .meter i {
      display: block;
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, var(--pink), var(--yellow), var(--blue));
      transition: width 140ms ease;
    }
    .scoreline {
      display: grid;
      justify-items: end;
      gap: 2px;
      font-family: Bahnschrift, "Segoe UI", sans-serif;
    }
    #scoreText {
      font-size: 26px;
      line-height: 1;
      color: var(--ink);
    }
    #encoreText {
      font: 700 11px/1 Consolas, "Courier New", monospace;
      color: var(--muted);
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
      background: #111018;
      touch-action: none;
    }
    .controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1px;
      border-top: 1px solid var(--line);
      background: var(--line);
    }
    button {
      min-width: 0;
      border: 0;
      color: var(--ink);
      background: #191521;
      font: inherit;
      font-size: 16px;
      letter-spacing: 0;
    }
    button:first-child {
      background: var(--ink);
      color: var(--black);
      font-weight: 700;
    }
    button:disabled {
      color: rgba(255, 250, 242, 0.32);
      background: #14111a;
    }
    button.ready {
      color: #111018;
      background: linear-gradient(90deg, var(--yellow), var(--orange));
      font-weight: 700;
    }
    .hint {
      margin: 0;
      padding: 8px 14px 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.4;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    @media (max-height: 700px) {
      .phone {
        height: 100dvh;
        min-height: 0;
        grid-template-rows: 104px 44px 1fr 46px 30px;
      }
      .hero {
        grid-template-columns: 96px 1fr;
        padding: 10px 12px;
      }
      .hero img {
        width: 96px;
        height: 82px;
      }
      h1 { font-size: 25px; }
    }
  </style>
</head>

      <div class="hero-copy">
        <p class="eyebrow">STARUSH PLAYTEST</p>
        <h1>用打 Call 的方式，打弹幕。</h1>
        <p class="sub">拖动移动 · 自动射击 · 命中染色 · 满槽安可</p>
      </div>
    </section>
    <section class="hud" aria-label="演出状态">
      <div>
        <span class="label">SUPPORT</span>
        <div class="meter" aria-label="应援槽"><i id="supportFill"></i></div>
      </div>
      <div class="scoreline">
        <span id="scoreText">0000</span>
        <small id="encoreText">ENCORE 0</small>
      </div>
    </section>
    <canvas id="game" width="375" height="520" aria-label="STARUSH 试玩画面"></canvas>
    <section class="controls">
      <button id="startBtn" type="button">开始公演</button>
      <button id="encoreBtn" type="button" disabled>安可爆发</button>
    </section>
    <p id="hintText" class="hint">按住舞台区域拖动。命中干扰会点亮地块，并触发短音色。</p>
  </main>

  <script>
    const canvas = document.querySelector("#game");
    const ctx = canvas.getContext("2d");
    const supportFill = document.querySelector("#supportFill");
    const scoreText = document.querySelector("#scoreText");
    const encoreText = document.querySelector("#encoreText");
    const hintText = document.querySelector("#hintText");
    const startBtn = document.querySelector("#startBtn");
    const encoreBtn = document.querySelector("#encoreBtn");

    const W = 375;
    const H = 520;
    const colors = ["#ed6b93", "#4fa3e0", "#f0b429", "#8b7bd8", "#f08a4b"];
    const tones = [523.25, 659.25, 783.99, 987.77, 1174.66];

    let audio;
    let running = false;
    let lastTime = 0;
    let spawnTimer = 0;
    let fireTimer = 0;
    let score = 0;
    let support = 0;
    let encore = 0;
    let flash = 0;

    const player = { x: W / 2, y: H - 64, r: 15, targetX: W / 2, targetY: H - 64 };
    const bullets = [];
    const enemies = [];
    const sparks = [];
    const tiles = [];

    function resetTiles() {
      tiles.length = 0;
      const cols = 6;
      const rows = 8;
      const gap = 3;
      const tileW = (W - 44 - gap * (cols - 1)) / cols;
      const tileH = 25;
      for (let row = 0; row < rows; row += 1) {
        for (let col = 0; col < cols; col += 1) {
          tiles.push({
            x: 22 + col * (tileW + gap),
            y: 126 + row * (tileH + gap),
            w: tileW,
            h: tileH,
            color: null,
            glow: 0,
          });
        }
      }
    }

    function resetGame() {
      running = true;
      lastTime = performance.now();
      spawnTimer = 0;
      fireTimer = 0;
      score = 0;
      support = 0;
      encore = 0;
      flash = 0;
      bullets.length = 0;
      enemies.length = 0;
      sparks.length = 0;
      player.x = W / 2;
      player.y = H - 64;
      player.targetX = player.x;
      player.targetY = player.y;
      resetTiles();
      setHint("拖动角色躲开干扰，自动射击会把舞台染成应援色。");
      updateHud();
      requestAnimationFrame(loop);
    }

    function ensureAudio() {
      if (!audio) audio = new AudioContext();
      if (audio.state === "suspended") audio.resume();
    }

    function playTone(index, boost = 0) {
      if (!audio) return;
      const now = audio.currentTime;
      const osc = audio.createOscillator();
      const gain = audio.createGain();
      osc.type = "triangle";
      osc.frequency.setValueAtTime(tones[index % tones.length] + boost, now);
      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.exponentialRampToValueAtTime(0.08, now + 0.012);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.16);
      osc.connect(gain).connect(audio.destination);
      osc.start(now);
      osc.stop(now + 0.18);
    }

    function playEncoreChord() {
      [0, 2, 4].forEach((tone, i) => setTimeout(() => playTone(tone, 120 + i * 28), i * 70));
    }

    function setHint(text) {
      hintText.textContent = text;
    }

    function updateHud() {
      supportFill.style.width = Math.round(support * 100) + "%";
      scoreText.textContent = String(score).padStart(4, "0");
      encoreText.textContent = "ENCORE " + encore;
      const ready = support >= 1;
      encoreBtn.disabled = !ready;
      encoreBtn.classList.toggle("ready", ready);
    }

    function fire() {
      const colorIndex = (score + bullets.length + encore) % colors.length;
      bullets.push({ x: player.x, y: player.y - 18, vy: -355, r: 5, colorIndex });
    }

    function spawnEnemy() {
      const colorIndex = Math.floor(Math.random() * colors.length);
      enemies.push({
        x: 30 + Math.random() * (W - 60),
        y: -22,
        vx: (Math.random() - 0.5) * 35,
        vy: 70 + Math.random() * 40,
        r: 13 + Math.random() * 5,
        colorIndex,
        pulse: Math.random() * Math.PI * 2,
      });
    }

    function nearestTile(x, y) {
      let best = tiles[0];
      let bestDist = Infinity;
      for (const tile of tiles) {
        const cx = tile.x + tile.w / 2;
        const cy = tile.y + tile.h / 2;
        const d = (cx - x) ** 2 + (cy - y) ** 2;
        if (d < bestDist) {
          best = tile;
          bestDist = d;
        }
      }
      return best;
    }

    function colorTile(x, y, colorIndex) {
      const tile = nearestTile(x, y);
      tile.color = colors[colorIndex];
      tile.glow = 1;
    }

    function addSpark(x, y, colorIndex, count = 8) {
      for (let i = 0; i < count; i += 1) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 45 + Math.random() * 130;
        sparks.push({
          x,
          y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          life: 0.45 + Math.random() * 0.25,
          maxLife: 0.7,
          color: colors[colorIndex],
        });
      }
    }

    function hitEnemy(enemyIndex, bulletIndex) {
      const enemy = enemies[enemyIndex];
      const bullet = bullets[bulletIndex];
      colorTile(enemy.x, enemy.y, bullet.colorIndex);
      addSpark(enemy.x, enemy.y, bullet.colorIndex, 11);
      playTone(bullet.colorIndex);
      enemies.splice(enemyIndex, 1);
      bullets.splice(bulletIndex, 1);
      score += 85;
      support = Math.min(1, support + 0.12);
      if (support >= 1) setHint("应援槽已满，点击安可爆发清屏。");
      updateHud();
    }

    function triggerEncore() {
      if (support < 1) return;
      support = 0;
      encore += 1;
      flash = 1;
      playEncoreChord();
      for (const tile of tiles) {
        const colorIndex = Math.floor(Math.random() * colors.length);
        tile.color = colors[colorIndex];
        tile.glow = 1;
      }
      for (const enemy of enemies) addSpark(enemy.x, enemy.y, enemy.colorIndex, 9);
      score += enemies.length * 90 + 320;
      enemies.length = 0;
      setHint("安可触发：干扰清场，全场地块点亮。");
      updateHud();
    }

    function update(dt) {
      player.x += (player.targetX - player.x) * Math.min(1, dt * 12);
      player.y += (player.targetY - player.y) * Math.min(1, dt * 12);
      spawnTimer -= dt;
      fireTimer -= dt;
      if (spawnTimer <= 0) {
        spawnEnemy();
        spawnTimer = Math.max(0.34, 0.82 - encore * 0.05 - score / 30000);
      }
      if (fireTimer <= 0) {
        fire();
        fireTimer = 0.18;
      }
      for (const bullet of bullets) bullet.y += bullet.vy * dt;
      for (const enemy of enemies) {
        enemy.x += enemy.vx * dt;
        enemy.y += enemy.vy * dt;
        enemy.pulse += dt * 4;
        if (enemy.x < 18 || enemy.x > W - 18) enemy.vx *= -1;
      }
      for (const spark of sparks) {
        spark.x += spark.vx * dt;
        spark.y += spark.vy * dt;
        spark.vy += 120 * dt;
        spark.life -= dt;
      }
      for (const tile of tiles) tile.glow = Math.max(0, tile.glow - dt * 1.8);
      flash = Math.max(0, flash - dt * 1.8);
      for (let i = enemies.length - 1; i >= 0; i -= 1) {
        if (enemies[i].y > H + 30) {
          enemies.splice(i, 1);
          support = Math.max(0, support - 0.04);
          updateHud();
        }
      }
      for (let i = bullets.length - 1; i >= 0; i -= 1) {
        if (bullets[i].y < -20) bullets.splice(i, 1);
      }
      for (let i = sparks.length - 1; i >= 0; i -= 1) {
        if (sparks[i].life <= 0) sparks.splice(i, 1);
      }
      for (let ei = enemies.length - 1; ei >= 0; ei -= 1) {
        for (let bi = bullets.length - 1; bi >= 0; bi -= 1) {
          const enemy = enemies[ei];
          const bullet = bullets[bi];
          const d = (enemy.x - bullet.x) ** 2 + (enemy.y - bullet.y) ** 2;
          if (d < (enemy.r + bullet.r) ** 2) {
            hitEnemy(ei, bi);
            break;
          }
        }
      }
    }

    function drawStage() {
      const gradient = ctx.createLinearGradient(0, 0, 0, H);
      gradient.addColorStop(0, "#181624");
      gradient.addColorStop(1, "#0b0a10");
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, W, H);
      ctx.strokeStyle = "rgba(255,255,255,.08)";
      ctx.lineWidth = 1;
      for (let y = 82; y < H; y += 40) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(W, y + 18);
        ctx.stroke();
      }
      ctx.fillStyle = "rgba(255,255,255,.08)";
      ctx.font = "700 12px Consolas, monospace";
      ctx.fillText("STAGE PRESSURE", 20, 34);
      ctx.fillStyle = "rgba(255,255,255,.36)";
      ctx.font = "12px Microsoft YaHei, sans-serif";
      ctx.fillText("弹幕 = 舞台干扰 / 命中 = 应援点亮", 20, 56);
    }

    function drawTiles() {
      for (const tile of tiles) {
        ctx.fillStyle = tile.color || "rgba(255,255,255,.055)";
        ctx.fillRect(tile.x, tile.y, tile.w, tile.h);
        if (tile.glow > 0) {
          ctx.strokeStyle = "rgba(255,255,255," + tile.glow * 0.8 + ")";
          ctx.lineWidth = 2;
          ctx.strokeRect(tile.x - 1, tile.y - 1, tile.w + 2, tile.h + 2);
        }
      }
    }

    function drawPlayer() {
      ctx.save();
      ctx.translate(player.x, player.y);
      ctx.shadowColor = colors[score % colors.length];
      ctx.shadowBlur = 18;
      ctx.fillStyle = "#fffaf2";
      ctx.beginPath();
      ctx.arc(0, 0, player.r, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.strokeStyle = colors[(encore + 2) % colors.length];
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.arc(0, 0, player.r + 7, -Math.PI * 0.7, Math.PI * 0.2);
      ctx.stroke();
      ctx.fillStyle = "#09080d";
      ctx.font = "700 10px Consolas, monospace";
      ctx.textAlign = "center";
      ctx.fillText("CALL", 0, 4);
      ctx.restore();
    }

    function drawBullets() {
      for (const bullet of bullets) {
        ctx.fillStyle = colors[bullet.colorIndex];
        ctx.beginPath();
        ctx.arc(bullet.x, bullet.y, bullet.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "rgba(255,255,255,.9)";
        ctx.fillRect(bullet.x - 1, bullet.y - 10, 2, 7);
      }
    }

    function drawEnemies() {
      for (const enemy of enemies) {
        const pulse = 1 + Math.sin(enemy.pulse) * 0.12;
        ctx.save();
        ctx.translate(enemy.x, enemy.y);
        ctx.scale(pulse, pulse);
        ctx.strokeStyle = "rgba(255,255,255,.7)";
        ctx.lineWidth = 2;
        ctx.fillStyle = "rgba(255,255,255,.12)";
        ctx.beginPath();
        ctx.arc(0, 0, enemy.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
        ctx.strokeStyle = colors[enemy.colorIndex];
        ctx.beginPath();
        ctx.moveTo(-enemy.r * 0.6, -enemy.r * 0.6);
        ctx.lineTo(enemy.r * 0.6, enemy.r * 0.6);
        ctx.moveTo(enemy.r * 0.6, -enemy.r * 0.6);
        ctx.lineTo(-enemy.r * 0.6, enemy.r * 0.6);
        ctx.stroke();
        ctx.restore();
      }
    }

    function drawSparks() {
      for (const spark of sparks) {
        ctx.globalAlpha = Math.max(0, spark.life / spark.maxLife);
        ctx.fillStyle = spark.color;
        ctx.fillRect(spark.x - 2, spark.y - 2, 4, 4);
        ctx.globalAlpha = 1;
      }
    }

    function drawFlash() {
      if (flash <= 0) return;
      ctx.globalAlpha = flash * 0.52;
      ctx.fillStyle = "#fffaf2";
      ctx.fillRect(0, 0, W, H);
      ctx.globalAlpha = 1;
      ctx.fillStyle = "rgba(240,180,41," + flash + ")";
      ctx.font = "700 54px Bahnschrift, Microsoft YaHei, sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("ENCORE", W / 2, H / 2);
    }

    function drawIdle() {
      drawStage();
      drawTiles();
      ctx.fillStyle = "rgba(0,0,0,.42)";
      ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = "#fffaf2";
      ctx.font = "300 34px Microsoft YaHei, sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("准备公演", W / 2, H / 2 - 24);
      ctx.fillStyle = "rgba(255,255,255,.72)";
      ctx.font = "14px Microsoft YaHei, sans-serif";
      ctx.fillText("点击开始后，拖动舞台区域移动", W / 2, H / 2 + 12);
    }

    function render() {
      drawStage();
      drawTiles();
      drawBullets();
      drawEnemies();
      drawSparks();
      drawPlayer();
      drawFlash();
    }

    function loop(now) {
      if (!running) return;
      const dt = Math.min(0.033, (now - lastTime) / 1000);
      lastTime = now;
      update(dt);
      render();
      requestAnimationFrame(loop);
    }

    function setPointerFromEvent(event) {
      const rect = canvas.getBoundingClientRect();
      const x = ((event.clientX - rect.left) / rect.width) * W;
      const y = ((event.clientY - rect.top) / rect.height) * H;
      player.targetX = Math.max(24, Math.min(W - 24, x));
      player.targetY = Math.max(260, Math.min(H - 34, y));
    }

    canvas.addEventListener("pointerdown", (event) => {
      canvas.setPointerCapture(event.pointerId);
      setPointerFromEvent(event);
    });

    canvas.addEventListener("pointermove", (event) => {
      if (event.pressure === 0 && event.pointerType !== "mouse") return;
      setPointerFromEvent(event);
    });

    startBtn.addEventListener("click", () => {
      ensureAudio();
      resetGame();
      startBtn.textContent = "重新开始";
    });

    encoreBtn.addEventListener("click", () => {
      ensureAudio();
      triggerEncore();
    });

    resetTiles();
    drawIdle();
    updateHud();
  </script>
</body>
</html>
